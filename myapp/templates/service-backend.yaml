apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    app: {{ include "myapp.fullname" . }}-backend
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.containerPort }}