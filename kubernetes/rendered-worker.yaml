"#cloud-config\n\nhostname: worker-1\npreserve_hostname: false\nssh_pwauth: false\npackage_update: false\npackage_upgrade: false\n\nwrite_files:\n  - path: /etc/modules-load.d/k8s.conf\n    content: |\n      overlay\n      br_netfilter\n\n\n  - path: /etc/sysctl.d/k8s.conf\n    content: |\n      net.bridge.bridge-nf-call-iptables  = 1\n      net.bridge.bridge-nf-call-ip6tables = 1\n      net.ipv4.ip_forward                 = 1\n\nruncmd:\n  - echo \"10.10.1.10 master-1\" \u003e\u003e /etc/hosts\n  - echo \"10.10.2.11 worker-1\" \u003e\u003e /etc/hosts\n  - echo \"10.10.2.12 worker-2\" \u003e\u003e /etc/hosts\n  - echo \"10.10.2.13 worker-3\" \u003e\u003e /etc/hosts\n  - echo \"10.10.2.14 worker-4\" \u003e\u003e /etc/hosts\n\n  - swapoff -a\n  - sed -i '/ swap / s/^/#/' /etc/fstab\n  - modprobe overlay\n  - modprobe br_netfilter\n  - sysctl --system\n  - until apt-get update; do echo \"waiting for network (NAT via master)...\"; sleep 10; done\n  - DEBIAN_FRONTEND=noninteractive apt-get upgrade -y\n  - DEBIAN_FRONTEND=noninteractive apt-get install -y containerd apt-transport-https ca-certificates curl gpg\n  - mkdir -p /etc/containerd\n  - containerd config default \u003e /etc/containerd/config.toml\n  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml\n  - systemctl enable --now containerd\n  - systemctl restart containerd\n  - mkdir -p -m 755 /etc/apt/keyrings\n  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.34/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg\n  - echo \"deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /\" \u003e /etc/apt/sources.list.d/kubernetes.list\n  - apt-get update\n  - DEBIAN_FRONTEND=noninteractive apt-get install -y kubelet kubeadm kubectl\n  - apt-mark hold kubelet kubeadm kubectl\n"