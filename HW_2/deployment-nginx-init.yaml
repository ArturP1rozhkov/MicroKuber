apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-init
  labels:
    app: nginx-init
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-init
  template:
    metadata:
      labels:
        app: nginx-init
    spec:
      initContainers:
        - name: wait-for-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nslookup nginx-init-svc.default.svc.cluster.local; do
                echo "waiting for nginx-init-svc...";
                sleep 2;
              done;
              echo "Service found, starting nginx"
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80